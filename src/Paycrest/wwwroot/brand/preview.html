<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WageHarbor brand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap">
<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f4f6fb; color: #0B2545; }
  .row { display: flex; gap: 24px; padding: 28px; align-items: center; flex-wrap: wrap; }
  .light { background: #fff; } .dark { background: #0b1220; color: #fff; }
  .chip { width: 22px; height: 22px; border-radius: 6px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  small { opacity: .6; display: block; margin-top: 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="row light"><img src="wageharbor-logo.svg" height="64" alt="WageHarbor"><img src="wageharbor-logo.svg" height="36" alt=""></div>
  <div class="row dark"><img src="wageharbor-logo-dark.svg" height="64" alt="WageHarbor"><img src="wageharbor-logo-dark.svg" height="36" alt=""></div>
  <div class="row light">
    <img src="wageharbor-mark.svg" height="128" alt="">
    <img src="wageharbor-mark.svg" height="64" alt="">
    <img src="wageharbor-mark.svg" height="32" alt="">
    <img src="wageharbor-mark.svg" height="16" alt="">
  </div>
  <div class="row light" style="font-size:14px">
    <span><span class="chip" style="background:#0B2545"></span>Harbor Navy #0B2545</span>
    <span><span class="chip" style="background:#0E7C86"></span>Deep Teal #0E7C86</span>
    <span><span class="chip" style="background:#5EEAD4"></span>Sea Foam #5EEAD4</span>
    <span><span class="chip" style="background:#FBBF24"></span>Beacon Gold #FBBF24</span>
  </div>
</body>
</html>
